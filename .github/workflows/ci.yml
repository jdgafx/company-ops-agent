name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t company-ops-agent:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name ops-ci -p 8000:8000 company-ops-agent:ci
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "healthz never returned 200" >&2
            docker logs ops-ci >&2
            docker rm -f ops-ci
            exit 1
          fi
          docker rm -f ops-ci

  eval-gate:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is empty; the eval gate cannot run" >&2
            exit 1
          fi
      - run: pip install -e ".[dev]"
      - run: python -m ops_agent.evals.run --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results-*.json
          if-no-files-found: warn
