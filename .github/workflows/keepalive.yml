name: keepalive
# Pings the free Render web service every ~10 minutes so it does not spin down
# after 15 idle minutes (Render free instances sleep on no inbound traffic).
# GitHub Actions schedules are best-effort; the run log is the proof of cadence.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /healthz
        run: |
          code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" https://company-ops-agent.onrender.com/healthz)
          echo "$(date -u +%FT%TZ) healthz=$code"
          test "$code" = "200"
